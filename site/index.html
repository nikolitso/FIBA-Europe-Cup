<style>
:root{
  --bg:#0c1424; --panel:#131d33; --line:#26334f; --text:#f1ead9; --muted:#9aa4ba;
  --gold:#d4af37; --win:#6fcf97; --loss:#eb7a6c;
  --serif:'Playfair Display',Georgia,serif; --body:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding:40px 16px 80px}
body.wide .wrap{max-width:none;padding-left:24px;padding-right:24px}   /* Projections: use the whole window so every column fits */
h1{font:700 clamp(30px,5vw,46px)/1.1 var(--serif);margin:0 0 6px}
h1 span{color:var(--gold)}
h1 a{color:inherit;text-decoration:none}
h1 a:hover{color:var(--gold)}
.home-link{display:inline-block;margin-bottom:14px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.home-link:hover{color:var(--gold)}
.sub{font:400 13px var(--mono);color:var(--muted);letter-spacing:.04em;margin-bottom:32px}
.controls{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:12px;align-items:end;margin-bottom:28px}
.tabs{display:flex;flex-wrap:wrap;gap:10px 28px;border-bottom:1px solid var(--line);margin:0 0 26px}
.tabs a{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 18px var(--serif);padding:0 0 10px;margin-bottom:-1px;cursor:pointer;text-decoration:none}
.tabs a.on{color:var(--text);border-color:var(--gold)}
.tabs a:hover{color:var(--text)}
.segs{display:flex;flex-wrap:wrap;gap:12px;grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{background:none;border:0;color:var(--muted);font:500 13px var(--mono);padding:9px 18px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.seg button.on{background:var(--gold);color:#0c1424}
label{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:5px}
input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:400 17px var(--body);padding:10px 12px}
input:focus{outline:2px solid var(--gold);outline-offset:0}
.swap{background:none;border:1px solid var(--line);color:var(--gold);border-radius:6px;font:500 18px var(--mono);height:46px;width:46px;cursor:pointer}
.vs{font:600 22px var(--serif);color:var(--gold);padding-bottom:9px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:24px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;text-align:center;align-items:center}
.score .name{font:600 clamp(18px,3vw,26px) var(--serif)}
.score .ctry{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.score .big{font:500 clamp(40px,8vw,68px) var(--mono);color:var(--gold);line-height:1}
.score .lbl{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:18px 0 14px;background:var(--line)}
.bar i{display:block;background:var(--gold)} .bar i+i{background:#5b7bd5}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;font:400 13px var(--mono);color:var(--muted);justify-content:center}
.facts b{color:var(--text);font-weight:500}
h2{font:600 22px var(--serif);margin:34px 0 12px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap}
.fx th.grp{text-align:center;color:var(--gold);border-bottom:1px solid var(--line)}
.fx .gap{border-right:1px solid var(--line);padding-right:14px}
.fx td.n{padding-left:6px;padding-right:8px}
.fx .hcp{color:var(--gold)}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(212,175,55,.08)}
.w{color:var(--win)} .l{color:var(--loss)}
.tag{font:400 11px var(--mono);color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.scroll{overflow-x:auto}
.note{font:400 14px/1.5 var(--body);color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:0 0 6px}
.note b{color:var(--text);font-weight:600}
td.big{color:var(--bg);background:var(--gold);font-weight:700}
/* Vs Market group tables */
h2.mkh{font:600 21px var(--serif);margin:38px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
table.mkt{table-layout:fixed;width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
table.mkt th{font:500 10.5px var(--mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;vertical-align:bottom;padding:6px 8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:visible}
table.mkt tr.mkgrp th{border-bottom:0;padding:0 12px 2px;height:16px}
table.mkt th.grp{color:var(--gold);text-align:center;font-size:10px;letter-spacing:.08em}
table.mkt th.grp span{display:block;border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,transparent);padding-bottom:4px}
table.mkt td{padding:11px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.mkt td.n,table.mkt th.n{text-align:right;font-family:var(--mono);font-size:13.5px}
table.mkt td.n b{font-weight:600}
/* sort arrow: after the label on Team, just under the label on number columns (adds no width) */
table.mkt th .ar{font-style:normal;font-size:9px;margin-left:5px}
table.mkt th.n.sort{position:relative}
table.mkt th.n .ar{position:absolute;right:8px;bottom:-1px;margin:0;font-size:8px;line-height:1}
table.mkt .tl{text-align:left}
table.mkt .sec0{border-left:1px solid color-mix(in srgb,var(--line) 80%,transparent);padding-left:10px}
table.mkt tr.click td{transition:background .12s}
table.mkt tr.click:hover td{background:color-mix(in srgb,var(--gold) 6%,transparent)}
table.mkt td.tl b{font-weight:600}
table.mkt .caret{display:inline-block;width:14px;color:var(--muted);font-size:11px}
table.mkt td.rd{white-space:normal;padding-top:8px;padding-bottom:8px;padding-right:2px}
body.wide table.mkt .pill{padding:2px 7px;margin-right:4px}
@media (min-width:1100px){body.wide .wrap{padding-left:16px;padding-right:16px}}   /* Vs Market: room for every column at 1200px */
table.mkt th.rd{padding-left:16px}
.pill{display:inline-block;margin:2px 6px 2px 0;padding:2px 9px;border-radius:999px;font:500 12px var(--body);line-height:1.5;border:1px solid transparent;white-space:nowrap}
.pill b{font:600 11.5px var(--mono);margin-left:2px}
.pill.w{color:var(--win);background:color-mix(in srgb,var(--win) 11%,transparent);border-color:color-mix(in srgb,var(--win) 28%,transparent)}
.pill.l{color:var(--loss);background:color-mix(in srgb,var(--loss) 11%,transparent);border-color:color-mix(in srgb,var(--loss) 28%,transparent)}
.pill.o{color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);border-color:color-mix(in srgb,var(--gold) 26%,transparent)}
table.mkt tr.mkgames td{white-space:normal;background:color-mix(in srgb,var(--panel) 70%,transparent)}
table.mkt tr.mkgames table{table-layout:auto;width:auto;min-width:0}
table.mkt tr.mkgames table td{white-space:nowrap;overflow:visible;padding:8px 6px}
table.mkt tr.mkgames table td.n{font-size:12.5px}
table.mkt tr.mkgames table th{padding:6px 6px 8px}
table.mkt tr.mkgames table td:nth-child(3){white-space:normal;min-width:150px}   /* only the opponent may wrap */
td.better{color:var(--win)!important;font-weight:700}td.worse{color:var(--loss)!important}
th.sort{cursor:pointer;user-select:none}th.sort:hover,th.sort.on{color:var(--gold)}
.rogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-top:16px}
.rogrid .card{padding:16px;margin:0}.rogrid h3{font:600 18px var(--serif);margin:0 0 2px;cursor:pointer}.rogrid h3:hover{color:var(--gold)}
.rogrid table{width:100%;border-collapse:collapse;margin-top:8px}.rogrid td,.rogrid th{padding:4px 4px;border-top:1px solid var(--line);font-size:14px}
.rogrid th{font:400 11px var(--mono);color:var(--muted);text-align:left;border-top:0}.rogrid .n{text-align:right}
.rogrid tr.out td{color:var(--loss)}.rogrid tr.out .pl{text-decoration:line-through}
@media (max-width:420px){.rogrid{grid-template-columns:1fr}}
.back{font:500 13px var(--mono);color:var(--gold);text-decoration:none;letter-spacing:.04em}
.back:hover{text-decoration:underline}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 14px}
.fbar label{font:400 13px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0;margin:0;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);font:500 12px var(--mono);padding:5px 12px;cursor:pointer}
.chip:hover{color:var(--text)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0c1424}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 8px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.metric .lbl{font:400 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.metric .big2{font:500 24px var(--mono);color:var(--gold)}
.pjbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin:0 0 8px}
.pjbar label{font:400 13px var(--mono);color:var(--muted);text-transform:none;letter-spacing:0;margin:0;display:flex;align-items:center;gap:8px}
select.peer{background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:500 14px var(--mono);padding:4px 6px;cursor:pointer}
select.peer:focus{outline:2px solid var(--gold)}
@media(max-width:640px){
  .controls{grid-template-columns:1fr auto 1fr}
  .vs{display:none} .swap{grid-column:2;grid-row:2}
  .controls>div:nth-of-type(1){grid-column:1/-1;grid-row:2}
}
</style>

<div class="wrap">
  <a class="home-link" href="/fibaeuropecup/" data-home>&#8962; Home</a>

<script>
// data files change after every update; a per-minute stamp keeps browsers from showing a cached copy for up to 10 minutes
(() => { const v = Math.floor(Date.now() / 60000);
  for (const f of ['data', 'fixtures', 'odds', 'archive', 'market', 'rosters', 'injuries', 'projections']) document.write(`<script src="${f}.js?v=${v}"><\/script>`); })();
</script>
<script>
const {matches, teams} = window.DATA;
let mode = 'country';
let venue = 'all';   // all | home | away, from the first pick's point of view
const $ = id => document.getElementById(id);
const ent = t => mode === 'team' ? t : teams[t];
const fmtDate = d => d.split('-').reverse().join('.');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('sub').textContent = `${matches.length} games · seasons ${matches[0][0].slice(0,4)}–${matches[matches.length-1][0].slice(-4)} · ${Object.keys(teams).length} teams · ${new Set(Object.values(teams)).size} countries`;

function names(){ return mode === 'team' ? Object.keys(teams).sort() : [...new Set(Object.values(teams))].sort(); }
function fillOptions(){ $('opts').innerHTML = names().map(n => `<option value="${esc(n)}">`).join(''); }

// Re-orient every game so that `x` is first. Returns {opp, own, oppPts, ownPts, ...}
function gamesFor(x){
  const out = [];
  for (const m of matches){
    const [season, stage, round, date, h, a, hp, ap, status] = m;
    const eh = ent(h), ea = ent(a);
    if (eh === ea) continue;
    if (eh === x) out.push({m, own:h, opp:a, oppE:ea, ownPts:hp, oppPts:ap, home:true});
    else if (ea === x) out.push({m, own:a, opp:h, oppE:eh, ownPts:ap, oppPts:hp, home:false});
  }
  return out;
}
function record(gs){
  let w=0,l=0,pf=0,pa=0,pg=0;
  for (const g of gs){
    g.ownPts > g.oppPts ? w++ : l++;
    if (g.m[8] !== 'AWA.'){ pf += g.ownPts; pa += g.oppPts; pg++; }
  }
  return {w,l,pf,pa,pg,n:gs.length};
}
const gameRow = g => {
  const [season, stage, round, date,,,,, status] = g.m;
  const win = g.ownPts > g.oppPts;
  const score = status === 'AWA.' ? 'awarded' : `${g.home ? g.ownPts : g.oppPts}–${g.home ? g.oppPts : g.ownPts}${status === 'AET' ? ' <span class="tag">OT</span>' : ''}`;
  const venue = g.home ? `<b>${esc(g.own)}</b> – ${esc(g.opp)}` : `${esc(g.opp)} – <b>${esc(g.own)}</b>`;
  return `<tr><td class="n">${fmtDate(date)}</td><td>${venue}</td><td class="n ${win?'w':'l'}">${score}</td><td class="tag">${esc(season)} · ${esc(stage)} · ${esc(round.replace(/ - /,' · '))}</td></tr>`;
};

// sample of the head to head pages and the fixtures (shared): stages and how many of the latest seasons (0 = all);
// same defaults as the rankings and projections
let hStages = new Set(['Main']), hSeasons = 5;
const hKeep = m => hStages.has(m[1]) && (!hSeasons || ALL_SEASONS.indexOf(m[0]) >= ALL_SEASONS.length - hSeasons);
function hBind(box, rerender){
  box.querySelector('#hSeasons').onchange = e => { hSeasons = +e.target.value; sync(); rerender(); };
  box.querySelectorAll('.fbar .chip').forEach(b => b.onclick = () => {
    const st = b.dataset.stage;
    if (hStages.has(st)){ if (hStages.size > 1) hStages.delete(st); }   // keep at least one stage
    else hStages.add(st);
    sync(); rerender();
  });
}
function hChips(){
  const opts = [...Array(ALL_SEASONS.length - 1)].map((_, k) => k + 1).concat([0]).map(k =>
    `<option value="${k}"${k === hSeasons ? ' selected' : ''}>${k ? (k === 1 ? 'Last season' : 'Last ' + k + ' seasons') : 'All ' + ALL_SEASONS.length + ' seasons'}</option>`).join('');
  return `<div class="fbar"><label>Sample <select id="hSeasons" class="peer">${opts}</select></label><span class="chips">` + PJ_STAGES.map(x => `<button type="button" class="chip${hStages.has(x) ? ' on' : ''}" data-stage="${esc(x)}" aria-pressed="${hStages.has(x)}">${esc(PJ_STAGE_LABEL[x] || x)}</button>`).join('') + `</span></div>`;
}
function render(){
  const box = $('out');
  const out = {set innerHTML(h){
    box.innerHTML = hChips() + h;
    hBind(box, render);
  }, querySelectorAll: q => box.querySelectorAll(q)};
  const A = $('a').value.trim(), B = $('b').value.trim();
  const ok = n => names().includes(n);
  if (!A){ box.innerHTML = `<div class="empty">Pick a ${mode} to see its record against everyone, or two to see their head to head.</div>`; return; }
  if (!ok(A)){ out.innerHTML = `<div class="empty">No ${mode} called “${esc(A)}”. Choose from the suggestions.</div>`; return; }
  const gs = gamesFor(A).filter(g => (venue === 'all' || (venue === 'home') === g.home) && hKeep(g.m));
  const where = venue === 'all' ? '' : (venue === 'home' ? ' at home' : ' away');

  if (B && ok(B)){
    if (A === B){ out.innerHTML = `<div class="empty">Pick two different ${mode === 'team' ? 'teams' : 'countries'}.</div>`; return; }
    const h = gs.filter(g => g.oppE === B).sort((x,y) => y.m[3].localeCompare(x.m[3]));
    if (!h.length){ out.innerHTML = `<div class="empty">${esc(A)} and ${esc(B)} have not met${venue === 'all' ? ' in this competition' : ` with ${esc(A)} playing${where}`}.</div>`; return; }
    const r = record(h);
    const sub = x => mode === 'team' ? teams[x] : '';
    let html = `<div class="card"><div class="score">
      <div><div class="name">${esc(A)}</div><div class="ctry">${esc(sub(A))}</div></div>
      <div><div class="big">${r.w}–${r.l}</div><div class="lbl">${r.n} game${r.n>1?'s':''}${where ? ` · ${esc(A)}${where}` : ''}</div></div>
      <div><div class="name">${esc(B)}</div><div class="ctry">${esc(sub(B))}</div></div></div>
      <div class="bar"><i style="width:${r.w/r.n*100}%"></i><i style="width:${r.l/r.n*100}%"></i></div>
      <div class="facts"><span>Avg points <b>${r.pg ? (r.pf/r.pg).toFixed(1) + '–' + (r.pa/r.pg).toFixed(1) : '–'}</b></span><span>Avg margin <b>${r.pg?((r.pf-r.pa)/r.pg>0?'+':'')+((r.pf-r.pa)/r.pg).toFixed(1):'–'}</b> for ${esc(A)}</span><span>First meeting <b>${fmtDate(h[h.length-1].m[3])}</b></span></div></div>`;
    if (mode === 'country'){
      const by = {};
      for (const g of h){ const k = g.own+'|'+g.opp; (by[k] ||= []).push(g); }

  if (!P || !P.list.length){ box.innerHTML = '<div class="empty">No games in the next days.</div>'; return; }
  const days = {};
  for (const g of P.list) (days[g.when.slice(0, 10)] ||= []).push(g);
  const head = `<tr><th rowspan="2" class="n">Time</th><th rowspan="2">Match</th><th colspan="3" class="grp gap">Model</th><th colspan="3" class="grp gap">Bookmaker</th><th colspan="2" class="grp gap" title="Model minus bookmaker">Model − book</th><th colspan="2" class="grp gap" title="How the two clubs have done against the bookmaker's lines this season (Vs Market tab), and whether that points the same way as the model">Vs market</th><th rowspan="2">Out</th></tr>
    <tr><th class="n" title="Handicap, home minus away">Hcp</th><th class="n">Total</th><th class="n gap" title="Home win chance">Home %</th>
      <th class="n" title="Handicap, home minus away">Hcp</th><th class="n">Total</th><th class="n gap" title="Home win chance from the money line, margin removed">Home %</th>
      <th class="n" title="Model handicap minus bookmaker handicap: above 0 = the model likes the home side more">Hcp</th><th class="n gap" title="Model total minus bookmaker total">Total</th>
      <th class="n" title="Home vs line minus away vs line: above 0 = the home club has beaten the market by more. Green = same way as Model − book, red = the other way">Hcp</th><th class="n gap" title="Average of the two clubs' total vs line: above 0 = their games go over. Green = same way as the model's total gap, red = the other way">Total</th></tr>`;
  const MK = new Map(mkData().rows.map(x => [x.team, x]));
  // agreement: the clubs' record against the market points the same way as the model's gap to the book (both need MK_MIN games)
  // the clubs' market number (home − away on the handicap, average on the total), green when it points the way of the model's gap
  const agree = (gap, trend, ok, what, detail = '') => trend === null ? '<td class="n tag">–</td>'
    : !ok || gap === null || !gap || !trend ? `<td class="n tag" title="${detail}${ok ? 'No bookmaker line yet' : 'Shown in colour once both clubs have ' + MK_MIN + ' games'}">${sgn(trend)}</td>`
    : (gap > 0) === (trend > 0) ? `<td class="n w" title="${detail}Agrees with the model: ${what} points the same way as Model − book (${sgn(gap)})"><b>${sgn(trend)}</b></td>`
                                : `<td class="n l" title="${detail}Disagrees with the model: ${what} points the other way from Model − book (${sgn(gap)})">${sgn(trend)}</td>`;
  const row = g => {
    const o = ODDS[g.h + '|' + g.a];
    const xh = MK.get(g.h), xa = MK.get(g.a), okS = xh && xa && xh.n >= MK_MIN && xa.n >= MK_MIN, okT = xh && xa && xh.tn >= MK_MIN && xa.tn >= MK_MIN;
    const bh = o ? -o.sp : null, bt = o ? o.tot : null, pb = bookWin(o);
    const out = g.outH.length || g.outA.length
      ? [g.outH.length ? `${esc(g.h)}: ${outText(g.outH)}` : '', g.outA.length ? `${esc(g.a)}: ${outText(g.outA)}` : ''].filter(Boolean).join('; ') : '–';
    return `<tr><td class="n">${g.when.slice(11)}</td>
      <td><b>${esc(g.h)}</b> <span class="tag">${esc(code(teams[g.h]))}</span> – <b>${esc(g.a)}</b> <span class="tag">${esc(code(teams[g.a]))}</span></td>
      <td class="n hcp"${g.adj ? ` title="Absences ${sgn(g.adj)}"` : ''}><b>${sgn(g.mh)}</b>${g.adj ? '*' : ''}</td><td class="n">${g.mt.toFixed(1)}</td><td class="n gap">${pct(g.ph)}</td>
      ${o ? `<td class="n" title="${esc((o.src || [''])[0])}">${sgn(bh)}</td><td class="n">${bt === null || bt === undefined ? '–' : bt.toFixed(1)}</td><td class="n gap">${pb === null ? '–' : pct(pb)}</td>`
          : '<td class="n tag" colspan="3" title="Lines appear a few days before the game">no line yet</td>'}
      ${o ? gapCell(g.mh - bh) + gapCell(bt === null || bt === undefined ? null : g.mt - bt, ' gap') : '<td class="n tag">–</td><td class="n tag gap">–</td>'}
      ${agree(o ? g.mh - bh : null, xh && xa ? xh.vsS - xa.vsS : null, okS, 'home − away vs line', xh && xa ? `${g.h} ${sgn(xh.vsS)} (${xh.n} games), ${g.a} ${sgn(xa.vsS)} (${xa.n} games). ` : '')}${agree(o && bt !== null && bt !== undefined ? g.mt - bt : null, xh && xa && xh.vsT !== null && xa.vsT !== null ? (xh.vsT + xa.vsT) / 2 : null, okT, 'the average of the two clubs vs the total', xh && xa && xh.vsT !== null && xa.vsT !== null ? `${g.h} games ${sgn(xh.vsT)}, ${g.a} games ${sgn(xa.vsT)} vs the total. ` : '').replace('class="n ', 'class="n gap ')}
      <td class="tag">${out}</td></tr>`;
  };
  const ratings = P.ratings.map((x, i) => `<tr><td class="n">${i + 1}</td><td><b>${esc(x.c)}</b> <span class="tag">${esc(code(teams[x.c]))}</span></td>
    <td class="n hcp"><b>${sgn(x.r)}</b></td><td class="n">${x.g}</td><td class="n">${sgn(x.prior)}</td></tr>`).join('');
  box.innerHTML = `<div class="note" style="margin-bottom:14px"><b>The model rates every club from this season's results</b>, with older games counting less, starting from last season's club rating (85%) and its country's power-ranking rating (15%); clubs new to the competition start from the country rating. Tonight's absences come off the club (the <b>Out</b> column, from the injury list, impact as on the Rosters tab; a handicap marked * includes them). Home advantage ${sgn(P.hca)}.
      It never looks at the bookmaker: <b>Model − book</b> is where the two disagree. <b>Vs market</b> shows how each club has done against the bookmaker's lines this season (as on the Vs Market tab): <b>Hcp</b> = home vs line − away vs line, <b>Total</b> = the two clubs' average vs the total line; green when it points the same way as Model − book (the market record backs the model), red when it points the other way; in colour once both clubs have ${MK_MIN} games. It is the same model as on the EuroCup page, with settings tuned on 2023-24 and 2024-25; tested on 2025-26 and 2026-27 (184 games) it picked 69.0% of winners with an average miss of 13.1 points, level with the earlier country model (69.6%, 13.2). The <a class="back" href="#view=archive" data-go="archive">Archive</a> keeps every projection made before tip-off.</div>
    <div class="pjbar">${gapSelect()}<span class="tag">Model − book gaps over this size are highlighted.</span></div>` +
    Object.entries(days).map(([d, list]) => `<h2>${dayName(d)} <span class="tag">${esc(list[0].round)}</span></h2>
      <div class="scroll"><table class="fx">${head}${list.map(row).join('')}</table></div>`).join('') +
    `<h2>Club ratings</h2><div class="tag" style="margin-bottom:8px">Points better (+) or worse (−) than an average club on a neutral court, after ${P.games} games this season. Prior = the starting point from last season and the country rating.</div>
    <div class="scroll"><table class="fx" style="width:auto;min-width:520px"><tr><th class="n">#</th><th>Club</th><th class="n">Rating</th><th class="n">Games</th><th class="n">Prior</th></tr>${ratings}</table></div>
    <div class="tag" style="margin-top:14px">Projections updated ${esc(P.updated)}; win chance = the handicap on a normal curve with the backtest's spread of misses (${P.spread} points).</div>`;
  bindGap(box, renderProjections);
  box.querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); setView(a.dataset.go); sync(); window.scrollTo({top: 0}); });
}

// ---------- Archive: frozen projections and bookmaker lines per day, with the results once they are in
// From Round 4 (27 Oct 2026) predict.py writes the club-rating model's projection for every game with a line and
// rewrites it until tip-off; earlier days were frozen from the Projections tab with the country model ("mix").
function arResult(date, h, a){
  const t = Date.parse(date + 'T12:00:00Z');
  return matches.find(m => m[4] === h && m[5] === a && m[8] !== 'AWA.' && Math.abs(Date.parse(m[3] + 'T12:00:00Z') - t) <= 36 * 3600e3);
}
function renderArchive(){
  const box = $('arView');
  const snaps = ((window.ARCHIVE && window.ARCHIVE.list) || []).slice().sort((x, y) => y.date.localeCompare(x.date));
  if (!snaps.length){ box.innerHTML = '<div class="empty">Nothing archived yet.</div>'; return; }
  // [model, book(, tie)]; w = winner picked, n = games where both made a pick
  const S = {total: 0, res: 0, cmp: 0, big: 0, eh: [0, 0], ch: [0, 0, 0], sh: [0, 0], w: [0, 0], wn: 0};
  const closer = (m, b) => m < b ? 'Model' : m > b ? 'Book' : 'Tie';
  const isBig = g => Math.abs(g.mh - g.bh) > gapMin;      // model and bookmaker more than gapMin points apart
  const sections = snaps.map(sn => {
    const rows = sn.games.map(g => {
      S.total++;
      const cmp = g.n >= MIN_GAMES && g.mh !== null;
      const r = arResult(sn.date, g.h, g.a);
      const big = cmp && isBig(g);
      const mv = cmp ? (big ? `<td class="n gap big" title="More than ${gapMin} points apart">${sgn(g.mh - g.bh)}</td>` : `<td class="n gap tag">${sgn(g.mh - g.bh)}</td>`)
                     : `<td class="n tag gap">${g.mh === null ? 'No comparable games' : `Only ${g.n} game${g.n === 1 ? '' : 's'} (need ${MIN_GAMES}+)`}</td>`;
      let res = '<td class="n tag gap" colspan="2">pending</td><td class="n tag"></td>';
      let col = ['', ''];                                       // projection / bookmaker cell: better or worse
      if (r){
        S.res++;
        const ah = r[6] - r[7], homeWon = r[6] > r[7];
        let cl = '<td class="n"></td>';                         // only judged when the gap is over gapMin
        if (cmp){
          S.cmp++;
          const eh = [Math.abs(ah - g.mh), Math.abs(ah - g.bh)];
          const c1 = closer(eh[0], eh[1]);
          const fm = favourite(g.mh), fb = favourite(g.bh);
          if (big){                                          // the summary covers only games more than gapMin apart
            S.big++; S.ch[c1 === 'Model' ? 0 : c1 === 'Book' ? 1 : 2]++;
            S.eh[0] += eh[0]; S.eh[1] += eh[1];
            if (fm && fb){ S.wn++; if ((fm > 0) === homeWon) S.w[0]++; if ((fb > 0) === homeWon) S.w[1]++; }
            // the side of the handicap line the model leaned to (home or away covers)
            if (ah !== g.bh){ S.sh[1]++; if ((g.mh > g.bh) === (ah > g.bh)) S.sh[0]++; }
          }
          const cls = c1 === 'Model' ? 'w' : c1 === 'Book' ? 'l' : 'tag';
          if (big){
            cl = `<td class="n ${cls}" title="Model off by ${eh[0].toFixed(1)}, book off by ${eh[1].toFixed(1)}"><b>${c1}</b></td>`;
            if (c1 !== 'Tie') col = c1 === 'Model' ? [' better', ' worse'] : [' worse', ' better'];
          }
        }
        res = `<td class="n gap"><b>${r[6]}–${r[7]}</b>${r[8] === 'AET' ? ' <span class="tag">OT</span>' : ''}</td><td class="n gap">${sgn(ah)}</td>${cl}`;
      }
      const ch = teams[g.h] || '', ca = teams[g.a] || '';
      return `<tr><td class="n">${esc(g.when)}</td>
        <td><b>${esc(g.h)}</b> <span class="tag">(${esc(code(ch))})</span> – <b>${esc(g.a)}</b> <span class="tag">(${esc(code(ca))})</span></td>
        <td class="n gap hcp${col[0]}">${g.mh === null ? '–' : sgn(g.mh)}</td><td class="n gap hcp${col[1]}">${sgn(g.bh)}</td>${mv}${res}</tr>`;
    }).join('');
    return `<h2>${dayName(sn.date)} <span class="tag">${esc(sn.round)}</span></h2>
      <div class="tag" style="margin-bottom:8px">Frozen ${esc(sn.taken)} · sample: ${esc(sn.sample)}</div>
      <div class="scroll"><table class="fx"><tr><th rowspan="2" class="n">Time</th><th rowspan="2">Match</th>
        <th class="grp gap" title="The model's handicap, home minus away">Projection</th><th class="grp gap">Bookmaker</th><th class="grp gap" title="Model against bookmaker, only where the sample had 8 or more games">Model vs book</th>
        <th colspan="2" class="grp gap">Result</th><th class="grp" title="Whose handicap was nearer the actual one, only where model and bookmaker were more than ${gapMin} points apart">Closer</th></tr>
        <tr><th class="n gap">Hcp</th><th class="n gap">Hcp</th><th class="n gap" title="Model handicap minus bookmaker handicap; highlighted when more than ${gapMin} points">Hcp</th>
        <th class="n gap">Score</th><th class="n gap">Hcp</th><th class="n" title="Whose handicap was nearer the actual one, when they were more than ${gapMin} points apart">Gap over ${gapMin}</th></tr>${rows}</table></div>`;
  }).join('');
  const avg = (v, n) => n ? (v / n).toFixed(1) : '–';
  const pc = (a, b) => b ? `${a} of ${b}` : '–';
  const card = (t, v, sub) => `<div class="metric"><div class="lbl">${t}</div><div class="big2">${v}</div><div class="tag">${sub}</div></div>`;
  // model vs book: green for the better one, red for the worse (white when level)
  const vs = (m, b, higherBetter, fmt = x => x) => {
    const c = x => m === b ? '' : (x === (higherBetter ? Math.max(m, b) : Math.min(m, b)) ? 'w' : 'l');
    return `<span class="${c(m)}">${fmt(m)}</span> <span class="tag">vs</span> <span class="${c(b)}">${fmt(b)}</span>`;
  };
  const summary = `<div class="metrics">
    ${card('Results in', `${S.res} of ${S.total}`, `${S.big} of ${S.cmp} compared games more than ${gapMin} pts apart`)}
    ${card('Winner picked', S.wn ? vs(S.w[0], S.w[1], true) : '–', S.wn ? `model vs book, out of ${S.wn} (${Math.round(S.w[0] / S.wn * 100)}% vs ${Math.round(S.w[1] / S.wn * 100)}%)` : 'model vs book')}
    ${card('Handicap error (avg points)', S.big ? vs(S.eh[0] / S.big, S.eh[1] / S.big, false, x => x.toFixed(1)) : '–', 'model vs book, lower is better')}
    ${card(`Closer when over ${gapMin} pts apart`, S.big ? vs(S.ch[0], S.ch[1], true) : '–', `model vs book, ${S.big} game${S.big === 1 ? '' : 's'}${S.ch[2] ? ', ' + S.ch[2] + ' tie' : ''}`)}
    ${card("Model's side of the handicap", S.sh[1] ? `<span class="${S.sh[0] * 2 > S.sh[1] ? 'w' : S.sh[0] * 2 < S.sh[1] ? 'l' : ''}">${S.sh[0]} of ${S.sh[1]}</span>` : '–', 'covered: green above half, red below (pushes and equal lines left out)')}
  </div>`;
  box.innerHTML = `<div class="pjbar">${gapSelect()}<span class="tag">Games further apart than this are highlighted, judged and counted in the cards below.</span></div>` + summary + sections +
    `<div class="tag" style="margin-top:14px">Each round is frozen from the Projections tab before the games, with the sample shown above, so later results never change it. Hcp is home minus away; Model vs book is the model's handicap minus the bookmaker's.
     Differences of more than ${gapMin} points are highlighted; only those games are judged: Closer says whose handicap was nearer the actual one, and the two handicaps turn green (nearer) and red (further). The result fills in by itself once the match is in the data.
     The model's side is the side of the bookmaker's line it leaned to (above the line = home covers). Only matches with ${MIN_GAMES} or more games in the sample are compared, and the cards above count only the games more than ${gapMin} points apart.</div>`;
  bindGap(box, renderArchive);
}

// ---------- Power rankings: country Elo over all games in date order
// Start 1500; K 20; home advantage 75 Elo points; margin-of-victory multiplier as in
// FiveThirtyEight's NBA Elo. Same-country games are skipped; awarded games count without margin.
// The table is always ordered by today's rating; the season sample only changes the record columns.
// Hidden countries still count in the ratings of the countries they played, but take no place in the table or in
// the projections' groups: Russia and Belarus (out of FIBA competitions since 2022) and any country without a game in the last
// PJ_DEFAULT_SEASONS seasons.
const RANK_HIDDEN = new Set(['Russia', 'Belarus']);
let RANK = null;
function computeRankings(){
  const K = 20, HCA = 75, elo = {}, st = {}, snaps = {};
  const get = c => (elo[c] ??= 1500);
  const s = c => (st[c] ??= {g: 0, w: 0, l: 0, pf: 0, pa: 0, pg: 0, last: ''});
  const snap = season => {          // place of every rated country after this season's games
    const o = {};
    Object.entries(elo).filter(([c]) => !RANK_HIDDEN.has(c)).sort((x, y) => y[1] - x[1]).forEach(([c], i) => o[c] = i + 1);
    snaps[season] = o;
  };
  const games = matches.slice().sort((x, y) => x[3].localeCompare(y[3]));
  let prev = null;
  for (const [season, , , date, h, a, hp, ap, status] of games){
    if (prev !== null && season !== prev && season > prev) snap(prev);
    if (prev === null || season > prev) prev = season;
    const ch = teams[h], ca = teams[a];
    if (!ch || !ca || ch === ca) continue;
    const rh = get(ch), ra = get(ca);
    const exp = 1 / (1 + 10 ** ((ra - (rh + HCA)) / 400));
    const homeWon = hp > ap ? 1 : 0;
    const margin = Math.abs(hp - ap);
    const winDiff = homeWon ? (rh + HCA - ra) : (ra - rh - HCA);
    const mult = status === 'AWA.' ? 1 : ((margin + 3) ** 0.8) / (7.5 + 0.006 * winDiff);
    const d = K * mult * (homeWon - exp);
    elo[ch] = rh + d; elo[ca] = ra - d;
    for (const [c, own, opp] of [[ch, hp, ap], [ca, ap, hp]]){
      const x = s(c); x.g++; own > opp ? x.w++ : x.l++; x.last = date; x.season = season;
      if (status !== 'AWA.'){ x.pf += own; x.pa += opp; x.pg++; }
    }
  }
  if (prev !== null) snap(prev);
  const active = ALL_SEASONS[Math.max(0, ALL_SEASONS.length - PJ_DEFAULT_SEASONS)];
  const rows = Object.keys(st).filter(c => !RANK_HIDDEN.has(c) && st[c].season >= active).map(c => ({c, elo: elo[c], ...st[c]})).sort((x, y) => y.elo - x.elo);
  rows.snaps = snaps;
  return rows;
}
// record columns over the last n seasons only (0 = all), in the chosen stages only
function rankWindow(n){
  const seasons = [...new Set(matches.map(m => m[0]))].sort();
  const ok = n ? new Set(seasons.slice(-n)) : null;
  const st = {};
  for (const [season, stage, , , h, a, hp, ap, status] of matches){
    if ((ok && !ok.has(season)) || !rkStages.has(stage)) continue;
    const ch = teams[h], ca = teams[a];
    if (!ch || !ca || ch === ca) continue;
    for (const [c, own, opp] of [[ch, hp, ap], [ca, ap, hp]]){
      const x = (st[c] ??= {g: 0, w: 0, l: 0, pf: 0, pa: 0, pg: 0});
      x.g++; own > opp ? x.w++ : x.l++;
      if (status !== 'AWA.'){ x.pf += own; x.pa += opp; x.pg++; }
    }
  }
  return {st, seasons, base: n ? seasons[seasons.length - n - 1] : null};
}
let rkSort = {k: 'place', dir: 1};
let rkStages = new Set(['Main']);                              // same default as the projections
let rkSeasons = PJ_DEFAULT_SEASONS;                            // same sample as the projections; 0 = all seasons
function renderRankings(){
  RANK ||= computeRankings();
  const {st, seasons, base} = rankWindow(rkSeasons);
  const sel = [...Array(seasons.length - 1)].map((_, k) => k + 1).concat([0]).map(k =>
    `<option value="${k}"${k === rkSeasons ? ' selected' : ''}>${k ? (k === 1 ? 'Last season' : 'Last ' + k + ' seasons') : 'All ' + seasons.length + ' seasons'}</option>`).join('');
  const list = RANK.map((r, i) => {
    const x = st[r.c] || {g: 0, w: 0, l: 0, pf: 0, pa: 0, pg: 0};
    const m = x.pg ? (x.pf - x.pa) / x.pg : 0;
    const keys = {place: i + 1, country: r.c, rating: r.elo, games: x.g,
      wl: x.g ? x.w - x.l : null, pct: x.g ? x.w / x.g : null, margin: x.pg ? m : null};
    return {keys, html: `<tr class="click" data-c="${esc(r.c)}"><td class="n">${i + 1}</td>
      <td><b>${esc(r.c)}</b> <span class="tag">(${esc(code(r.c))})</span></td>
      <td class="n"><b class="hcp">${Math.round(r.elo)}</b></td>
      <td class="n">${x.g}</td>
      <td class="n">${x.g ? `<span class="w">${x.w}</span>–<span class="l">${x.l}</span>` : '–'}</td>
      <td class="n">${x.g ? (x.w / x.g * 100).toFixed(0) + '%' : '–'}</td>
      <td class="n">${x.pg ? (m > 0 ? '+' : m < 0 ? '−' : '') + Math.abs(m).toFixed(1) : '–'}</td></tr>`};
  });
  const {k, dir} = rkSort;
  list.sort((p, q) => {                                         // empty values always last
    const a = p.keys[k], b = q.keys[k];
    if (a === null || b === null) return (a === null) - (b === null) || p.keys.place - q.keys.place;
    return (typeof a === 'string' ? a.localeCompare(b) : a - b) * dir || p.keys.place - q.keys.place;
  });
  const rows = list.filter(x => x.keys.games).map(x => x.html).join('');   // no games in the sample: not listed
  const th = (key, label, cls, title) => `<th class="${cls} sort${key === k ? ' on' : ''}" data-k="${key}"${title ? ` title="${title}"` : ''}>${label}${key === k ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  const stTxt = PJ_STAGES.filter(x => rkStages.has(x)).map(x => PJ_STAGE_LABEL[x] || x).join(', ');
  const note = (rkSeasons
    ? `Sample: the ${rkSeasons === 1 ? 'last season' : 'last ' + rkSeasons + ' seasons'} (${esc(seasonLabel(seasons[seasons.length - rkSeasons]))} to ${esc(seasonLabel(seasons[seasons.length - 1]))})`
    : `Sample: all ${seasons.length} seasons`) + `; stages: ${esc(stTxt)}. Games, W–L, win % and margin cover the sample only.`;
  const chips = PJ_STAGES.map(x => `<button type="button" class="chip${rkStages.has(x) ? ' on' : ''}" data-stage="${esc(x)}" aria-pressed="${rkStages.has(x)}">${esc(PJ_STAGE_LABEL[x] || x)}</button>`).join('');
  $('rkView').innerHTML = `<div class="fbar"><label>Sample <select id="rkSeasons" class="peer">${sel}</select></label><span class="chips">${chips}</span></div>
    <div class="scroll"><table class="fx"><tr>${th('place', '#', 'n')}${th('country', 'Country', '')}
    ${th('rating', 'Rating', 'n', 'Elo rating today: starts at 1500, rises with wins (more for beating strong sides, by more, away)')}
    ${th('games', 'Games', 'n', 'Games against clubs from other countries, within the sample')}${th('wl', 'W–L', 'n', 'Sorted by wins minus losses')}${th('pct', 'Win %', 'n')}
    ${th('margin', 'Margin', 'n', 'Average points margin per game')}</tr>${rows}</table></div>
    <div class="tag" style="margin-top:14px">${note} Rating is an Elo rating updated game by game since 2015–16 and always reflects today. Games between clubs from the same country are not counted. Countries without a game in the last ${PJ_DEFAULT_SEASONS} seasons are not ranked, nor are Russia and Belarus, out of FIBA competitions since 2022. Click a column heading to sort, a country for its full record.</div>`;

    const c = tr.dataset.club; mkOpen.has(c) ? mkOpen.delete(c) : mkOpen.add(c); renderMarket();
  });
  box.querySelectorAll('th.sort').forEach(h => h.onclick = () => {
    const c = h.dataset.k;
    mkSort = mkSort.k === c ? {k: c, dir: -mkSort.dir} : {k: c, dir: c === 'team' ? 1 : -1};
    renderMarket();
  });
}
function setView(v){
  view = ['fixtures', 'projections', 'archive', 'market', 'h2h', 'rosters', 'rankings'].includes(v) ? v : 'market';
  document.querySelectorAll('#tabs a').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.body.classList.toggle('wide', view === 'projections' || view === 'archive' || view === 'market');
  $('fxView').hidden = view !== 'fixtures';
  $('rkView').hidden = view !== 'rankings';
  $('arView').hidden = view !== 'archive';
  $('mkView').hidden = view !== 'market';
  $('pjView').hidden = view !== 'projections';
  $('h2hView').hidden = view !== 'h2h';
  $('roView').hidden = view !== 'rosters';
  if (view === 'fixtures') renderFixtures();
  if (view === 'rankings') renderRankings();
  if (view === 'projections') renderProjections();
  if (view === 'archive') renderArchive();
  if (view === 'market') renderMarket();
  if (view === 'rosters') renderRosters();
}
document.querySelectorAll('#tabs a').forEach(b => b.onclick = e => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return; e.preventDefault(); setView(b.dataset.view); sync(); });
// Home: back to the start (countries, all venues, nothing selected, head to head tab)
document.querySelectorAll('[data-home]').forEach(a => a.onclick = e => {
  e.preventDefault();
  setMode('country'); setVenue('all'); $('a').value = $('b').value = '';
  setView('market'); render();
  history.replaceState(null, '', location.pathname);
  window.scrollTo({top: 0, behavior: 'smooth'});
});

function sync(){
  // only the head to head page carries its picks; defaults and empty fields stay out of the link
  const q = new URLSearchParams({view});
  if (view === 'h2h'){
    if (mode !== 'country') q.set('mode', mode);
    if (venue !== 'all') q.set('venue', venue);
    if ($('a').value) q.set('a', $('a').value);
    if ($('b').value) q.set('b', $('b').value);
  }
  if (view === 'h2h' || view === 'fixtures'){
    if (hSeasons !== PJ_DEFAULT_SEASONS) q.set('seasons', hSeasons || 'all');
    if (!(hStages.size === 1 && hStages.has('Main'))) q.set('stages', PJ_STAGES.filter(x => hStages.has(x)).join(','));
  }
  if ((view === 'projections' || view === 'archive') && gapMin !== GAP_DEFAULT) q.set('gap', gapMin);
  if (view === 'rankings' && rkSeasons !== PJ_DEFAULT_SEASONS) q.set('seasons', rkSeasons || 'all');
  if (view === 'rankings' && !(rkStages.size === 1 && rkStages.has('Main'))) q.set('stages', PJ_STAGES.filter(x => rkStages.has(x)).join(','));
  if (view === 'projections'){
    if (pjFilter.seasons !== PJ_DEFAULT_SEASONS) q.set('seasons', pjFilter.seasons || 'all');
    if (!(pjFilter.stages.size === 1 && pjFilter.stages.has('Main'))) q.set('stages', PJ_STAGES.filter(x => pjFilter.stages.has(x)).join(','));
  }
  history.replaceState(null, '', '#' + q.toString());
}
function setMode(m){
  mode = m;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('la').textContent = m === 'team' ? 'Team' : 'Country';
  $('lb').textContent = 'Opponent (optional)';
  fillOptions();
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { setMode(b.dataset.mode); $('a').value = $('b').value = ''; sync(); render(); });
function setVenue(v){
  venue = ['home','away'].includes(v) ? v : 'all';
  document.querySelectorAll('#venue button').forEach(b => b.classList.toggle('on', b.dataset.venue === venue));
}
document.querySelectorAll('#venue button').forEach(b => b.onclick = () => { setVenue(b.dataset.venue); sync(); render(); });
['a','b'].forEach(id => $(id).addEventListener('input', () => { sync(); render(); }));
$('a').addEventListener('change', render); $('b').addEventListener('change', render);

// restore from URL hash
const p = new URLSearchParams(location.hash.slice(1));
setMode(p.get('mode') === 'team' ? 'team' : 'country');
setVenue(p.get('venue'));
if (['h2h', 'fixtures', null].includes(p.get('view'))){
  const st = (p.get('stages') || '').split(',').filter(x => PJ_STAGES.includes(x));
  if (st.length) hStages = new Set(st);
  const v = p.get('seasons'), n = +v;
  if (v === 'all') hSeasons = 0;
  else if (n >= 1 && n < ALL_SEASONS.length) hSeasons = Math.round(n);
}
if (p.get('view') !== 'projections'){ $('a').value = p.get('a') || ''; $('b').value = p.get('b') || ''; }
render();
{ const g = +p.get('gap'); if (g >= 4 && g <= 10) gapMin = Math.round(g); }
if (p.get('view') === 'rankings'){
  const v = p.get('seasons'), n = +v;
  if (v === 'all') rkSeasons = 0;
  else if (n >= 1 && n < ALL_SEASONS.length) rkSeasons = Math.round(n);
  const st = (p.get('stages') || '').split(',').filter(x => PJ_STAGES.includes(x));
  if (st.length) rkStages = new Set(st);
}
if (p.get('view') === 'projections'){
  const n = +p.get('seasons');
  if (p.get('seasons') === 'all') pjFilter.seasons = 0;
  else if (n >= 1 && n < ALL_SEASONS.length) pjFilter.seasons = Math.round(n);
  const st = (p.get('stages') || '').split(',').filter(x => PJ_STAGES.includes(x));
  if (st.length) pjFilter.stages = new Set(st);
}
setView(p.get('view'));
</script>
</body>
